<!doctype html>
<!--
  Source for public/og-image.png (1200x630 social share image).
  To regenerate: open this file in a browser with a 1200x630 viewport and take a
  screenshot of the page. Example numbers are from the calculator for 2026 at
  50.000 € revenue and 0 € expenses with default settings.
-->
<html lang="sl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: #1f2937;
    background:
      linear-gradient(#ffffffd9, #ffffffd9),
      repeating-linear-gradient(135deg, #e5e7eb 0 1px, transparent 1px 12px),
      #ffffff;
    display: grid;
    grid-template-columns: 1fr 470px;
    gap: 56px;
    padding: 64px 72px;
  }
  .left { display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 52px; height: 52px; color: #dc2626; }
  h1 { margin-top: 64px; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; }
  p.sub { margin-top: 24px; font-size: 28px; line-height: 1.35; color: #4b5563; max-width: 560px; }
  .badge {
    margin-top: auto; align-self: flex-start;
    background: #00d3bb; color: #00302a; font-weight: 700; font-size: 22px;
    padding: 10px 20px; border-radius: 10px;
  }
  .right { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .caption { font-size: 18px; color: #6b7280; font-weight: 500; margin-bottom: 2px; }
  .card { border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px -10px #0f172a55; }
  .card .name { background: #1f2937; color: #fff; font-size: 22px; font-weight: 600; padding: 14px 20px; }
  .bar { display: flex; height: 52px; font-size: 19px; font-weight: 700; color: #fff; }
  .bar span { display: flex; align-items: center; padding: 0 16px; white-space: nowrap; }
  .net { background: #166534; }
  .tax { background: #991b1b; justify-content: flex-end; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 21H10C6.70017 21 5.05025 21 4.02513 19.9749C3 18.9497 3 17.2998 3 14V3"/>
        <path d="M6.99707 5.99902C10.5286 5.999 17.9122 7.46328 17.6979 16.5654M15.4886 14.955L17.3721 16.8519C17.5656 17.0468 17.8798 17.0482 18.0751 16.8552L19.9971 14.955"/>
      </svg>
      obdavcen.si
    </div>
    <h1>Normirani s.&nbsp;p., s.&nbsp;p. ali d.&nbsp;o.&nbsp;o.?</h1>
    <p class="sub">Izračunaj, pri kateri obliki ti od prihodkov ostane največ.</p>
    <div class="badge">Davki in prispevki 2026</div>
  </div>
  <div class="right">
    <div class="caption">Primer: 50.000 € prihodkov, 0 € stroškov</div>
    <div class="card">
      <div class="name">Normirani s.&nbsp;p.</div>
      <div class="bar"><span class="net" style="width:80%">Ostane 80 %</span><span class="tax" style="width:20%">20 %</span></div>
    </div>
    <div class="card">
      <div class="name">D.&nbsp;o.&nbsp;o.</div>
      <div class="bar"><span class="net" style="width:63%">Ostane 63 %</span><span class="tax" style="width:37%">Davki 37 %</span></div>
    </div>
    <div class="card">
      <div class="name">S.&nbsp;p.</div>
      <div class="bar"><span class="net" style="width:56%">Ostane 56 %</span><span class="tax" style="width:44%">Davki 44 %</span></div>
    </div>
  </div>
</body>
</html>
